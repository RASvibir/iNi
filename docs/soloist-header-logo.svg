<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="144" viewBox="0 0 280 72" role="img" aria-label="uXu iNi">
  <title>uXu iNi</title>
  <rect width="280" height="72" fill="#ffffff"/>
  <!-- DOS-style uXu wordmark -->
  <rect x="2" y="14" width="118" height="44" fill="#050805" stroke="#39ff14" stroke-width="3"/>
  <g opacity="0.3" stroke="#000000" stroke-width="1">
    <line x1="2" y1="20" x2="120" y2="20"/>
    <line x1="2" y1="26" x2="120" y2="26"/>
    <line x1="2" y1="32" x2="120" y2="32"/>
    <line x1="2" y1="38" x2="120" y2="38"/>
    <line x1="2" y1="44" x2="120" y2="44"/>
    <line x1="2" y1="50" x2="120" y2="50"/>
  </g>
  <text x="61" y="46" text-anchor="middle" font-family="Courier New, monospace" font-size="34" font-weight="700" letter-spacing="3" fill="#39ff14">uXu</text>
  <!-- iNi stamp -->
  <g transform="translate(140 12) rotate(-5)">
    <rect x="0" y="0" width="86" height="42" rx="2" fill="#0a080f" stroke="#5dff8a" stroke-width="2"/>
    <rect x="2" y="2" width="82" height="38" fill="none" stroke="#ffe14a" stroke-opacity="0.35" stroke-width="1"/>
    <text x="18" y="30" font-family="Courier New, monospace" font-size="26" font-weight="700" fill="#5dff8a">i</text>
    <text x="36" y="30" font-family="Courier New, monospace" font-size="26" font-weight="700" fill="#ffe14a">N</text>
    <text x="58" y="30" font-family="Courier New, monospace" font-size="26" font-weight="700" fill="#5dff8a">i</text>
  </g>
</svg>
